<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração | ProtegeMais Parceiros</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #111827;
            --primary-hover: #1f2937;
            --background: #f4f6f8;
            --card: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --danger: #dc2626;
            --success: #16a34a;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .login-logo {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: var(--muted);
            margin-bottom: 30px;
        }

        /* =========================
           APP
        ========================= */

        #app {
            display: none;
        }

        header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 25px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .brand {
            font-size: 21px;
            font-weight: 800;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-user img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
        }

        .user-info {
            font-size: 13px;
        }

        .user-info strong {
            display: block;
        }

        .user-info span {
            color: var(--muted);
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px 60px;
        }

        /* =========================
           TOPO
        ========================= */

        .page-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-title h1 {
            margin: 0 0 5px;
            font-size: 28px;
        }

        .page-title p {
            margin: 0;
            color: var(--muted);
        }

        /* =========================
           BOTÕES
        ========================= */

        button {
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #eef2f7;
            color: var(--text);
        }

        .btn-danger {
            background: #fee2e2;
            color: var(--danger);
        }

        .btn-google {
            width: 100%;
            background: #111827;
            color: white;
            padding: 14px;
            font-size: 15px;
        }

        /* =========================
           ESTATÍSTICAS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 27px;
            font-weight: 800;
        }

        /* =========================
           LISTA
        ========================= */

        .partners-container {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            overflow: hidden;
        }

        .partners-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .partners-header strong {
            font-size: 16px;
        }

        .search {
            width: 260px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
        }

        .search:focus {
            border-color: #9ca3af;
        }

        .partner-list {
            padding: 0;
        }

        .partner-item {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .partner-item:last-child {
            border-bottom: 0;
        }

        .partner-main {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .partner-logo {
            width: 58px;
            height: 58px;
            border-radius: 10px;
            border: 1px solid var(--border);
            object-fit: contain;
            background: #fafafa;
            flex-shrink: 0;
        }

        .partner-logo-placeholder {
            width: 58px;
            height: 58px;
            border-radius: 10px;
            background: #eef2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #6b7280;
            flex-shrink: 0;
        }

        .partner-info {
            min-width: 0;
        }

        .partner-name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .partner-meta {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .partner-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            z-index: 500;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-card {
            width: 100%;
            max-width: 720px;
            max-height: 90vh;
            overflow-y: auto;

            background: white;
            border-radius: 18px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            background: #f3f4f6;
            font-size: 18px;
            width: 38px;
            height: 38px;
            padding: 0;
        }

        /* =========================
           FORMULÁRIO
        ========================= */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #9ca3af;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .checkbox-group input {
            width: auto;
        }

        .form-actions {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border);

            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            padding: 12px 15px;
            border-radius: 9px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .status.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .status.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            padding: 50px 20px;
            text-align: center;
            color: var(--muted);
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: var(--muted);
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 14px 15px;
            }

            .header-user .user-info {
                display: none;
            }

            main {
                padding: 20px 15px 40px;
            }

            .page-top {
                align-items: stretch;
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .partners-header {
                align-items: stretch;
                flex-direction: column;
            }

            .search {
                width: 100%;
            }

            .partner-item {
                align-items: flex-start;
                flex-direction: column;
            }

            .partner-actions {
                width: 100%;
            }

            .partner-actions button {
                flex: 1;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .modal {
                padding: 10px;
            }

            .modal-card {
                padding: 20px;
                max-height: 95vh;
            }
        }
    </style>
</head>

<body>

<!-- =========================================================
     FIREBASE
========================================================= -->

<script type="module">

    import {
        initializeApp
    } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
        signOut
    } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
        getFirestore,
        collection,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        doc,
        serverTimestamp
    } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // ========================================================
    // CONFIGURAÇÃO
    // ========================================================

    const firebaseConfig = {

        apiKey: "AIzaSyDiTMMiV1-NF9qrWb4XDXE9ZcazThq12CQ",

        authDomain: "protegemais-parceiros.firebaseapp.com",

        projectId: "protegemais-parceiros",

        storageBucket: "protegemais-parceiros.firebasestorage.app",

        messagingSenderId: "836148089634",

        appId: "1:836148089634:web:cfc7598a6323a3ce744b7b"

    };


    // ========================================================
    // FIREBASE
    // ========================================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const provider = new GoogleAuthProvider();


    // ========================================================
    // ELEMENTOS
    // ========================================================

    const loginScreen =
        document.getElementById("loginScreen");

    const appScreen =
        document.getElementById("app");

    const loginBtn =
        document.getElementById("loginBtn");

    const loginStatus =
        document.getElementById("loginStatus");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const userName =
        document.getElementById("userName");

    const userEmail =
        document.getElementById("userEmail");

    const userPhoto =
        document.getElementById("userPhoto");

    const partnerList =
        document.getElementById("partnerList");

    const searchInput =
        document.getElementById("searchInput");

    const newPartnerBtn =
        document.getElementById("newPartnerBtn");

    const partnerModal =
        document.getElementById("partnerModal");

    const closeModalBtn =
        document.getElementById("closeModalBtn");

    const cancelBtn =
        document.getElementById("cancelBtn");

    const partnerForm =
        document.getElementById("partnerForm");

    const modalTitle =
        document.getElementById("modalTitle");

    const statusBox =
        document.getElementById("status");


    // ========================================================
    // ESTADO
    // ========================================================

    let partners = [];

    let editingId = null;


    // ========================================================
    // LOGIN
    // ========================================================

    loginBtn.addEventListener("click", async () => {

        try {

            loginStatus.textContent =
                "Abrindo login...";

            await signInWithPopup(
                auth,
                provider
            );

        } catch (error) {

            console.error(error);

            loginStatus.textContent =
                "Erro no login: " + error.message;

        }

    });


    // ========================================================
    // LOGOUT
    // ========================================================

    logoutBtn.addEventListener("click", async () => {

        await signOut(auth);

    });


    // ========================================================
    // ESTADO DA AUTENTICAÇÃO
    // ========================================================

    onAuthStateChanged(auth, async (user) => {

        if (user) {

            loginScreen.style.display = "none";

            appScreen.style.display = "block";

            userName.textContent =
                user.displayName || "Administrador";

            userEmail.textContent =
                user.email || "";

            if (user.photoURL) {

                userPhoto.src =
                    user.photoURL;

            } else {

                userPhoto.style.display =
                    "none";

            }

            await loadPartners();

        } else {

            loginScreen.style.display =
                "flex";

            appScreen.style.display =
                "none";

        }

    });


    // ========================================================
    // CARREGAR PARCEIROS
    // ========================================================

    async function loadPartners() {

        partnerList.innerHTML = `
            <div class="loading">
                Carregando parceiros...
            </div>
        `;

        try {

            const snapshot =
                await getDocs(
                    collection(db, "partners")
                );

            partners = [];

            snapshot.forEach((document) => {

                partners.push({

                    id: document.id,

                    ...document.data()

                });

            });


            partners.sort((a, b) => {

                const nameA =
                    (a.name || "").toLowerCase();

                const nameB =
                    (b.name || "").toLowerCase();

                return nameA.localeCompare(nameB);

            });


            renderPartners();

            updateStats();

        } catch (error) {

            console.error(error);

            showStatus(
                "Erro ao carregar parceiros: " +
                error.message,
                "error"
            );

            partnerList.innerHTML = `
                <div class="empty">
                    Não foi possível carregar os parceiros.
                </div>
            `;

        }

    }


    // ========================================================
    // RENDERIZAR
    // ========================================================

    function renderPartners() {

        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const filtered =
            partners.filter((partner) => {

                const text = `

                    ${partner.name || ""}

                    ${partner.segment || ""}

                    ${partner.city || ""}

                `.toLowerCase();

                return text.includes(search);

            });


        if (filtered.length === 0) {

            partnerList.innerHTML = `
                <div class="empty">
                    Nenhum parceiro encontrado.
                </div>
            `;

            return;

        }


        partnerList.innerHTML =
            filtered.map(partner => {

                const logo =
                    partner.logo
                        ? `
                            <img
                                class="partner-logo"
                                src="${escapeAttribute(partner.logo)}"
                                alt="${escapeAttribute(partner.name || "")}"
                                onerror="this.style.display='none'">
                          `
                        : `
                            <div class="partner-logo-placeholder">
                                ${getInitials(partner.name)}
                            </div>
                          `;


                const status =
                    partner.active === false
                        ? "Inativo"
                        : "Ativo";


                return `

                    <div class="partner-item">

                        <div class="partner-main">

                            ${logo}

                            <div class="partner-info">

                                <div class="partner-name">
                                    ${escapeHtml(partner.name || "Sem nome")}
                                </div>

                                <div class="partner-meta">

                                    ${escapeHtml(partner.segment || "Sem segmento")}
                                    •
                                    ${escapeHtml(partner.city || "Sem cidade")}

                                    <br>

                                    ${status}

                                    ${
                                        partner.featured
                                            ? " • ⭐ Destaque"
                                            : ""
                                    }

                                </div>

                            </div>

                        </div>


                        <div class="partner-actions">

                            <button
                                class="btn-secondary"
                                onclick="editPartner('${partner.id}')">

                                Editar

                            </button>


                            <button
                                class="btn-danger"
                                onclick="removePartner('${partner.id}')">

                                Excluir

                            </button>

                        </div>

                    </div>

                `;

            }).join("");

    }


    // ========================================================
    // ESTATÍSTICAS
    // ========================================================

    function updateStats() {

        document.getElementById(
            "totalPartners"
        ).textContent = partners.length;


        document.getElementById(
            "featuredPartners"
        ).textContent =
            partners.filter(
                partner => partner.featured === true
            ).length;


        document.getElementById(
            "activePartners"
        ).textContent =
            partners.filter(
                partner => partner.active !== false
            ).length;

    }


    // ========================================================
    // NOVO PARCEIRO
    // ========================================================

    newPartnerBtn.addEventListener(
        "click",
        () => {

            editingId = null;

            modalTitle.textContent =
                "Novo parceiro";

            partnerForm.reset();

            document.getElementById(
                "active"
            ).checked = true;

            document.getElementById(
                "type"
            ).value = "physical";

            partnerModal.classList.add(
                "active"
            );

        }
    );


    // ========================================================
    // EDITAR
    // ========================================================

    window.editPartner = function(id) {

        const partner =
            partners.find(
                p => p.id === id
            );

        if (!partner) return;


        editingId = id;

        modalTitle.textContent =
            "Editar parceiro";


        document.getElementById("name").value =
            partner.name || "";

        document.getElementById("segment").value =
            partner.segment || "";

        document.getElementById("city").value =
            partner.city || "";

        document.getElementById("discount").value =
            partner.discount || "";

        document.getElementById("type").value =
            partner.type || "physical";

        document.getElementById("phone").value =
            partner.phone || "";

        document.getElementById("address").value =
            partner.address || "";

        document.getElementById("description").value =
            partner.description || "";

        document.getElementById("logo").value =
            partner.logo || "";

        document.getElementById("instagram").value =
            partner.instagram || "";

        document.getElementById("facebook").value =
            partner.facebook || "";

        document.getElementById("mapEmbedUrl").value =
            partner.mapEmbedUrl || "";

        document.getElementById("featured").checked =
            partner.featured === true;

        document.getElementById("active").checked =
            partner.active !== false;


        partnerModal.classList.add(
            "active"
        );

    };


    // ========================================================
    // SALVAR
    // ========================================================

    partnerForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const data = {

                name:
                    document.getElementById("name").value.trim(),

                segment:
                    document.getElementById("segment").value,

                city:
                    document.getElementById("city").value,

                discount:
                    document.getElementById("discount").value.trim(),

                type:
                    document.getElementById("type").value,

                phone:
                    document.getElementById("phone").value.trim(),

                address:
                    document.getElementById("address").value.trim(),

                description:
                    document.getElementById("description").value.trim(),

                logo:
                    document.getElementById("logo").value.trim(),

                instagram:
                    document.getElementById("instagram").value.trim(),

                facebook:
                    document.getElementById("facebook").value.trim(),

                mapEmbedUrl:
                    document.getElementById("mapEmbedUrl").value.trim(),

                featured:
                    document.getElementById("featured").checked,

                active:
                    document.getElementById("active").checked

            };


            try {

                if (editingId) {

                    await updateDoc(

                        doc(
                            db,
                            "partners",
                            editingId
                        ),

                        {
                            ...data,
                            updatedAt:
                                serverTimestamp()
                        }

                    );


                    showStatus(
                        "Parceiro atualizado com sucesso.",
                        "success"
                    );

                } else {

                    await addDoc(

                        collection(
                            db,
                            "partners"
                        ),

                        {
                            ...data,

                            createdAt:
                                serverTimestamp(),

                            updatedAt:
                                serverTimestamp()
                        }

                    );


                    showStatus(
                        "Parceiro cadastrado com sucesso.",
                        "success"
                    );

                }


                closeModal();

                await loadPartners();


            } catch (error) {

                console.error(error);

                showStatus(
                    "Erro ao salvar: " +
                    error.message,
                    "error"
                );

            }

        }
    );


    // ========================================================
    // EXCLUIR
    // ========================================================

    window.removePartner = async function(id) {

        const partner =
            partners.find(
                p => p.id === id
            );


        if (!partner) return;


        const confirmed =
            confirm(
                `Excluir o parceiro "${partner.name || "sem nome"}"?`
            );


        if (!confirmed) return;


        try {

            await deleteDoc(

                doc(
                    db,
                    "partners",
                    id
                )

            );


            showStatus(
                "Parceiro excluído com sucesso.",
                "success"
            );


            await loadPartners();


        } catch (error) {

            console.error(error);

            showStatus(
                "Erro ao excluir: " +
                error.message,
                "error"
            );

        }

    };


    // ========================================================
    // MODAL
    // ========================================================

    function closeModal() {

        partnerModal.classList.remove(
            "active"
        );

        editingId = null;

    }


    closeModalBtn.addEventListener(
        "click",
        closeModal
    );


    cancelBtn.addEventListener(
        "click",
        closeModal
    );


    partnerModal.addEventListener(
        "click",
        (event) => {

            if (
                event.target === partnerModal
            ) {

                closeModal();

            }

        }
    );


    // ========================================================
    // PESQUISA
    // ========================================================

    searchInput.addEventListener(
        "input",
        renderPartners
    );


    // ========================================================
    // STATUS
    // ========================================================

    function showStatus(
        message,
        type
    ) {

        statusBox.textContent =
            message;

        statusBox.className =
            "status " + type;


        setTimeout(() => {

            statusBox.className =
                "status";

        }, 4000);

    }


    // ========================================================
    // SEGURANÇA / HTML
    // ========================================================

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function escapeAttribute(value) {

        return escapeHtml(value);

    }


    function getInitials(name) {

        if (!name) return "?";


        return name
            .split(" ")
            .filter(Boolean)
            .slice(0, 2)
            .map(
                word =>
                    word.charAt(0)
                        .toUpperCase()
            )
            .join("");

    }

</script>

</body>
</html>
